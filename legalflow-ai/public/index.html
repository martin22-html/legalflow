<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LegalFlow AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap');
:root {
  --bg: #ECEEF0; --surface: #F6F5F2; --surface-2: #E2E4E7; --border: #C9CDD3;
  --ink: #1B2430; --muted: #5B636E; --accent: #7A2E2E; --accent-dark: #5E2222;
  --brass: #9C7F3E;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 26px; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 19px; }
.brand span { color: var(--accent); }
.topnav { display: flex; gap: 18px; align-items: center; font-size: 13.5px; }
.topnav a { color: var(--muted); text-decoration: none; cursor: pointer; }
.topnav a:hover, .topnav a.active { color: var(--ink); font-weight: 600; }
.wrap { max-width: 760px; margin: 0 auto; padding: 30px 20px 60px; }
h1 { font-family: 'Source Serif 4', Georgia, serif; font-size: 24px; margin: 0 0 18px; }
h2 { font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; margin: 26px 0 12px; }
.card { background: var(--surface); border: 1px solid var(--border); padding: 22px 24px; margin-bottom: 16px; border-radius: 3px; }
label { display: block; font-size: 12.5px; font-weight: 600; margin: 12px 0 6px; }
label:first-child { margin-top: 0; }
input[type=text], input[type=email], input[type=password], input[type=date], textarea, select {
  width: 100%; font-family: 'Inter', sans-serif; font-size: 14px; padding: 10px 12px;
  border: 1px solid var(--border); background: var(--bg); color: var(--ink); border-radius: 3px;
}
textarea { min-height: 90px; resize: vertical; }
.row { display: flex; gap: 12px; }
.row > div { flex: 1; }
.btn { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; padding: 10px 20px;
  background: var(--accent); color: #fff; border: none; border-radius: 3px; cursor: pointer; margin-top: 14px; }
.btn:hover { background: var(--accent-dark); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn.small { padding: 6px 12px; font-size: 12.5px; margin-top: 0; }
.chip-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.chip { font-size: 12.5px; padding: 7px 13px; border-radius: 16px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); cursor: pointer; }
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.error { color: var(--accent); font-size: 13.5px; margin-top: 10px; }
.muted { color: var(--muted); font-size: 13px; }
.dossier-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.dossier-item:last-child { border-bottom: none; }
.dossier-item:hover { color: var(--accent); }
.tag { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 12px; border: 1px solid var(--brass); color: var(--brass); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.tab { padding: 10px 16px; font-size: 13.5px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.result-box { border-left: 3px solid var(--brass); background: var(--bg); padding: 12px 16px; margin: 10px 0; font-size: 14px; line-height: 1.6; }
ul.simple { margin: 6px 0; padding-left: 18px; }
ul.simple li { margin: 4px 0; font-size: 14px; }
.draft-text { white-space: pre-wrap; font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; line-height: 1.65; background: #fff; border: 1px solid var(--border); padding: 16px; margin-top: 8px; }
.echeance-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.echeance-row.faite { text-decoration: line-through; color: var(--muted); }
.source-link { display: block; font-size: 13px; margin: 4px 0; color: var(--accent); }
.link-back { font-size: 13px; color: var(--muted); cursor: pointer; margin-bottom: 10px; display: inline-block; }
.disclaimer { font-size: 11.5px; color: var(--muted); margin-top: 24px; border-top: 1px solid var(--border); padding-top: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div id="app"></div>
<script>
var state = { user: null, view: "loading", dossiers: [], currentDossier: null, tab: "analyse", error: null };

function api(method, url, body) {
  return fetch(url, {
    method: method,
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined
  }).then(function (r) {
    return r.json().then(function (data) {
      if (!r.ok) throw new Error(data.error || "Erreur serveur");
      return data;
    });
  });
}

function esc(s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

var SPECIALITES = ["Droit de la famille","Droit pénal","Indemnisation des victimes","Droit civil","Droit du travail","Droit commercial","Droit administratif"];
var TYPES_ACTE = ["Courrier au client","Mise en demeure","Note de synthèse","Conclusions (trame)","Email de suivi"];

function render() {
  var el = document.getElementById("app");
  if (state.view === "loading") { el.innerHTML = ""; return; }
  if (state.view === "auth") { el.innerHTML = renderAuth(); bindAuth(); return; }
  el.innerHTML = renderTopbar() + '<div class="wrap">' + (
    state.view === "dashboard" ? renderDashboard() :
    state.view === "dossier" ? renderDossier() :
    state.view === "recherche" ? renderRecherche() : ""
  ) + "</div>";
  bindTop();
  if (state.view === "dashboard") bindDashboard();
  if (state.view === "dossier") bindDossier();
  if (state.view === "recherche") bindRecherche();
}

function renderTopbar() {
  return '<div class="topbar"><div class="brand">Legal<span>Flow</span> AI</div>' +
    '<div class="topnav">' +
    '<a data-nav="dashboard" class="' + (state.view === "dashboard" ? "active" : "") + '">Dossiers</a>' +
    '<a data-nav="recherche" class="' + (state.view === "recherche" ? "active" : "") + '">Recherche juridique</a>' +
    '<span class="muted">' + esc(state.user.cabinet) + '</span>' +
    '<a data-logout="1">Déconnexion</a>' +
    "</div></div>";
}
function bindTop() {
  document.querySelectorAll("[data-nav]").forEach(function (a) {
    a.addEventListener("click", function () {
      state.view = a.getAttribute("data-nav");
      state.error = null;
      render();
      if (state.view === "dashboard") loadDossiers();
    });
  });
  var lo = document.querySelector("[data-logout]");
  if (lo) lo.addEventListener("click", function () {
    api("POST", "/api/logout").then(function () { state.user = null; state.view = "auth"; state.authMode = "login"; render(); });
  });
}

// ---------- AUTH ----------
function renderAuth() {
  var mode = state.authMode || "login";
  var specs = state.signupSpecs || [];
  return (
    '<div class="wrap" style="max-width:440px;padding-top:60px;">' +
    '<h1>Legal<span style="color:var(--accent)">Flow</span> AI</h1>' +
    '<p class="muted">' + (mode === "login" ? "Connexion au cabinet" : "Créer le compte du cabinet") + "</p>" +
    '<div class="card">' +
    (mode === "signup" ?
      '<label>Nom du cabinet</label><input type="text" id="a-cabinet">' +
      '<label>Avocat référent</label><input type="text" id="a-avocat">' +
      '<div class="row"><div><label>Barreau</label><input type="text" id="a-barreau"></div><div><label>N° de toque</label><input type="text" id="a-toque"></div></div>' +
      '<label>Domaines de spécialisation</label><div class="chip-grid">' + SPECIALITES.map(function(s){return '<button type="button" class="chip'+(specs.indexOf(s)!==-1?" active":"")+'" data-spec="'+esc(s)+'">'+esc(s)+"</button>";}).join("") + "</div>"
      : "") +
    '<label>Email</label><input type="email" id="a-email">' +
    '<label>Mot de passe</label><input type="password" id="a-password">' +
    '<button class="btn" id="auth-submit">' + (mode === "login" ? "Se connecter" : "Créer le compte") + "</button>" +
    (state.error ? '<p class="error">' + esc(state.error) + "</p>" : "") +
    '<p class="muted" style="margin-top:16px;">' +
    (mode === "login" ? "Pas encore de compte ? " : "Déjà un compte ? ") +
    '<a id="auth-switch" style="color:var(--accent);cursor:pointer;">' + (mode === "login" ? "Créer un cabinet" : "Se connecter") + "</a></p>" +
    "</div></div>"
  );
}
function bindAuth() {
  document.querySelectorAll("[data-spec]").forEach(function (chip) {
    chip.addEventListener("click", function () {
      state.signupSpecs = state.signupSpecs || [];
      var s = chip.getAttribute("data-spec");
      var i = state.signupSpecs.indexOf(s);
      if (i === -1) state.signupSpecs.push(s); else state.signupSpecs.splice(i, 1);
      render();
    });
  });
  document.getElementById("auth-switch").addEventListener("click", function () {
    state.authMode = state.authMode === "login" ? "signup" : "login";
    state.error = null;
    render();
  });
  document.getElementById("auth-submit").addEventListener("click", function () {
    var email = document.getElementById("a-email").value.trim();
    var password = document.getElementById("a-password").value;
    if (!email || !password) { state.error = "Email et mot de passe requis."; render(); return; }
    var mode = state.authMode || "login";
    var promise = mode === "login"
      ? api("POST", "/api/login", { email: email, password: password })
      : api("POST", "/api/signup", {
          email: email, password: password,
          cabinet: document.getElementById("a-cabinet").value.trim(),
          avocat: document.getElementById("a-avocat").value.trim(),
          barreau: document.getElementById("a-barreau").value.trim(),
          toque: document.getElementById("a-toque").value.trim(),
          specialites: state.signupSpecs || []
        });
    promise.then(function (data) {
      state.user = data.user; state.view = "dashboard"; state.error = null; render(); loadDossiers();
    }).catch(function (e) { state.error = e.message; render(); });
  });
}

// ---------- DASHBOARD ----------
function loadDossiers() {
  api("GET", "/api/dossiers").then(function (data) { state.dossiers = data.dossiers; render(); });
}
function renderDashboard() {
  return (
    "<h1>Dossiers</h1>" +
    '<div class="card">' +
    '<label>Nouveau dossier</label><input type="text" id="nd-nom" placeholder="Nom du dossier">' +
    '<div class="row"><div><label>Client</label><input type="text" id="nd-client"></div><div><label>Domaine</label><input type="text" id="nd-domaine"></div></div>' +
    '<label>Notes / contexte</label><textarea id="nd-notes" placeholder="Contexte utile pour l\'analyse et la rédaction"></textarea>' +
    '<button class="btn" id="nd-create">Créer le dossier</button>' +
    "</div>" +
    '<div class="card">' + (state.dossiers.length ? state.dossiers.map(function (d) {
      return '<div class="dossier-item" data-dossier="' + d.id + '"><span>' + esc(d.nom) + (d.client ? " — " + esc(d.client) : "") + '</span>' + (d.domaine ? '<span class="tag">' + esc(d.domaine) + "</span>" : "") + "</div>";
    }).join("") : '<p class="muted">Aucun dossier pour l\'instant.</p>') + "</div>"
  );
}
function bindDashboard() {
  document.getElementById("nd-create").addEventListener("click", function () {
    var nom = document.getElementById("nd-nom").value.trim();
    if (!nom) return;
    api("POST", "/api/dossiers", {
      nom: nom,
      client: document.getElementById("nd-client").value.trim(),
      domaine: document.getElementById("nd-domaine").value.trim(),
      notes: document.getElementById("nd-notes").value.trim()
    }).then(function () { loadDossiers(); });
  });
  document.querySelectorAll("[data-dossier]").forEach(function (item) {
    item.addEventListener("click", function () {
      openDossier(item.getAttribute("data-dossier"));
    });
  });
}

// ---------- DOSSIER DETAIL ----------
function openDossier(id) {
  api("GET", "/api/dossiers/" + id).then(function (data) {
    state.currentDossier = data;
    state.view = "dossier";
    state.tab = "analyse";
    state.error = null;
    render();
  });
}
function renderDossier() {
  var d = state.currentDossier;
  var tabsHtml = ["analyse","redaction","echeances"].map(function (t) {
    var labels = { analyse: "Analyse", redaction: "Rédaction", echeances: "Échéances" };
    return '<div class="tab' + (state.tab === t ? " active" : "") + '" data-tab="' + t + '">' + labels[t] + "</div>";
  }).join("");

  var body = "";
  if (state.tab === "analyse") {
    body = '<label>Texte à analyser (document, courrier, situation)</label><textarea id="an-texte" placeholder="Collez ici le texte du document ou décrivez la situation..."></textarea>' +
      '<button class="btn" id="an-submit">Analyser</button>' +
      (state.error ? '<p class="error">' + esc(state.error) + "</p>" : "") +
      (d.analyses.length ? d.analyses.map(renderAnalyse).join("") : "");
  } else if (state.tab === "redaction") {
    body = '<label>Type d\'acte</label><select id="rd-type">' + TYPES_ACTE.map(function(t){return '<option>'+esc(t)+'</option>';}).join("") + "</select>" +
      '<label>Instructions complémentaires</label><textarea id="rd-instructions" placeholder="Précisions, ton souhaité, points à inclure..."></textarea>' +
      '<button class="btn" id="rd-submit">Générer le projet</button>' +
      (state.error ? '<p class="error">' + esc(state.error) + "</p>" : "") +
      (d.redactions.length ? d.redactions.map(function (r) {
        return '<div class="result-box"><strong>' + esc(r.type_acte) + '</strong><div class="draft-text">' + esc(r.texte_genere) + "</div></div>";
      }).join("") : "");
  } else if (state.tab === "echeances") {
    body = '<div class="row"><div><label>Libellé</label><input type="text" id="ec-libelle"></div><div><label>Date</label><input type="date" id="ec-date"></div></div>' +
      '<button class="btn" id="ec-submit">Ajouter</button>' +
      '<div style="margin-top:16px;">' + (d.echeances.length ? d.echeances.map(function (e) {
        return '<div class="echeance-row' + (e.faite ? " faite" : "") + '" data-echeance="' + e.id + '"><input type="checkbox" ' + (e.faite ? "checked" : "") + '><span>' + esc(e.date_echeance) + " — " + esc(e.libelle) + "</span></div>";
      }).join("") : '<p class="muted">Aucune échéance.</p>') + "</div>";
  }

  return (
    '<span class="link-back" id="back-dashboard">← Tous les dossiers</span>' +
    "<h1>" + esc(d.dossier.nom) + "</h1>" +
    (d.dossier.client ? '<p class="muted">Client : ' + esc(d.dossier.client) + "</p>" : "") +
    '<div class="tabs">' + tabsHtml + "</div>" +
    '<div class="card">' + body + "</div>" +
    '<p class="disclaimer">Les résultats générés par l\'IA doivent être relus et validés par un avocat avant toute utilisation professionnelle.</p>'
  );
}
function renderAnalyse(a) {
  var r = a.resultat;
  return (
    '<div class="result-box">' +
    '<span class="tag">' + esc(r.domaine || "") + "</span>" +
    "<p>" + esc(r.resume || "") + "</p>" +
    (r.qualification ? "<p><em>" + esc(r.qualification) + "</em></p>" : "") +
    (r.delais && r.delais.length ? "<strong>Délais à vérifier</strong><ul class='simple'>" + r.delais.map(function(t){return "<li>"+esc(t)+"</li>";}).join("") + "</ul>" : "") +
    (r.taches && r.taches.length ? "<strong>Tâches</strong><ul class='simple'>" + r.taches.map(function(t){return "<li>"+esc(t)+"</li>";}).join("") + "</ul>" : "") +
    (r.pieces && r.pieces.length ? "<strong>Pièces à réunir</strong><ul class='simple'>" + r.pieces.map(function(t){return "<li>"+esc(t)+"</li>";}).join("") + "</ul>" : "") +
    (r.points_a_verifier && r.points_a_verifier.length ? "<strong>Points à vérifier</strong><ul class='simple'>" + r.points_a_verifier.map(function(t){return "<li>"+esc(t)+"</li>";}).join("") + "</ul>" : "") +
    "</div>"
  );
}
function bindDossier() {
  document.getElementById("back-dashboard").addEventListener("click", function () { state.view = "dashboard"; render(); loadDossiers(); });
  document.querySelectorAll("[data-tab]").forEach(function (t) {
    t.addEventListener("click", function () { state.tab = t.getAttribute("data-tab"); state.error = null; render(); });
  });
  var anBtn = document.getElementById("an-submit");
  if (anBtn) anBtn.addEventListener("click", function () {
    var texte = document.getElementById("an-texte").value.trim();
    if (!texte) return;
    anBtn.disabled = true; anBtn.textContent = "Analyse en cours…";
    api("POST", "/api/dossiers/" + state.currentDossier.dossier.id + "/analyse", { texte: texte })
      .then(function () { openDossier(state.currentDossier.dossier.id); })
      .catch(function (e) { state.error = e.message; anBtn.disabled = false; anBtn.textContent = "Analyser"; render(); });
  });
  var rdBtn = document.getElementById("rd-submit");
  if (rdBtn) rdBtn.addEventListener("click", function () {
    rdBtn.disabled = true; rdBtn.textContent = "Génération en cours…";
    api("POST", "/api/dossiers/" + state.currentDossier.dossier.id + "/redaction", {
      typeActe: document.getElementById("rd-type").value,
      instructions: document.getElementById("rd-instructions").value.trim()
    }).then(function () { openDossier(state.currentDossier.dossier.id); state.tab = "redaction"; })
      .catch(function (e) { state.error = e.message; rdBtn.disabled = false; rdBtn.textContent = "Générer le projet"; render(); });
  });
  var ecBtn = document.getElementById("ec-submit");
  if (ecBtn) ecBtn.addEventListener("click", function () {
    var libelle = document.getElementById("ec-libelle").value.trim();
    var date = document.getElementById("ec-date").value;
    if (!libelle || !date) return;
    api("POST", "/api/dossiers/" + state.currentDossier.dossier.id + "/echeances", { libelle: libelle, date_echeance: date })
      .then(function () { openDossier(state.currentDossier.dossier.id); state.tab = "echeances"; });
  });
  document.querySelectorAll("[data-echeance]").forEach(function (row) {
    row.addEventListener("click", function () {
      api("PUT", "/api/echeances/" + row.getAttribute("data-echeance") + "/toggle").then(function () {
        openDossier(state.currentDossier.dossier.id); state.tab = "echeances";
      });
    });
  });
}

// ---------- RECHERCHE ----------
function renderRecherche() {
  return (
    "<h1>Recherche juridique</h1>" +
    '<div class="card">' +
    '<label>Question</label><textarea id="rc-question" placeholder="Ex. : Quel est le délai de prescription pour une action en réparation d\'un préjudice corporel ?"></textarea>' +
    '<button class="btn" id="rc-submit">Rechercher</button>' +
    (state.error ? '<p class="error">' + esc(state.error) + "</p>" : "") +
    (state.rechercheResult ? renderRechercheResult(state.rechercheResult) : "") +
    "</div>" +
    '<p class="disclaimer">Vérifiez et imprimez chaque source avant de la verser au dossier.</p>'
  );
}
function renderRechercheResult(r) {
  return '<div class="result-box"><p>' + esc(r.reponse).replace(/\n/g,"<br>") + "</p>" +
    (r.sources && r.sources.length ? "<strong>Sources</strong>" + r.sources.map(function(s){return '<a class="source-link" href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title)+"</a>";}).join("") : "") + "</div>";
}
function bindRecherche() {
  document.getElementById("rc-submit").addEventListener("click", function () {
    var q = document.getElementById("rc-question").value.trim();
    if (!q) return;
    var btn = document.getElementById("rc-submit");
    btn.disabled = true; btn.textContent = "Recherche en cours…";
    api("POST", "/api/recherche", { question: q })
      .then(function (data) { state.rechercheResult = data; state.error = null; render(); })
      .catch(function (e) { state.error = e.message; btn.disabled = false; btn.textContent = "Rechercher"; render(); });
  });
}

// ---------- INIT ----------
api("GET", "/api/me").then(function (data) {
  if (data.user) { state.user = data.user; state.view = "dashboard"; render(); loadDossiers(); }
  else { state.view = "auth"; state.authMode = "login"; render(); }
}).catch(function () { state.view = "auth"; state.authMode = "login"; render(); });
</script>
</body>
</html>
